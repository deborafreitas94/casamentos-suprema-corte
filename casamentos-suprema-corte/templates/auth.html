{% extends 'base.html' %}{% block content %}<section class="box narrow"><h1>{{ 'Criar administrador' if mode=='setup' else 'Acesso administrativo' }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><label>Usuário<input name="username" required minlength="3" autocomplete="username"></label><label>Senha<input type="password" name="password" required minlength="{{ 12 if mode=='setup' else 1 }}" autocomplete="{{ 'new-password' if mode=='setup' else 'current-password' }}"></label><button class="button">{{ 'Criar acesso' if mode=='setup' else 'Entrar' }}</button></form>{% if mode == "login" and discord_enabled %}<p class="muted">Ou acesse usando o cargo do servidor:</p><a class="button" href="{{ url_for('discord_start') }}">Entrar com Discord</a>{% endif %}</section>{% endblock %}
